<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-page: #f4f6f9;
            --sidebar-bg: #ffffff;
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-page); color: var(--text-main); margin: 0; display: flex; height: 100vh; overflow: hidden; }

        sidebar { width: 260px; background: var(--sidebar-bg); height: 100%; padding: 24px; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: flex-start; gap: 20px; }
        .sidebar-top h2 { color: var(--primary); font-size: 20px; margin: 0 0 30px 0; display: flex; align-items: center; gap: 10px; }
        sidebar ul { list-style: none; padding: 0; margin: 0; }
        sidebar ul li { padding: 12px 16px; margin-bottom: 8px; border-radius: 10px; cursor: pointer; transition: all 0.2s; color: var(--text-muted); font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 12px; }
        sidebar ul li:hover { background: var(--primary-light); color: var(--primary); }
        sidebar ul li.active { background: var(--primary); color: white; }
        .btn-logout { background: #fef2f2; color: #dc2626; border: 1px solid #fee2e2; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: 600; width: 100%; transition: 0.2s; margin-top: 15px; }
        .btn-logout:hover { background: #fee2e2; }

        main { flex-grow: 1; padding: 30px; overflow-y: auto; height: 100vh; box-sizing: border-box; }
        .dashboard-container { max-width: 1200px; margin: 0 auto; }
        .header-bar { margin-bottom: 25px; }
        .header-bar h1 { font-size: 24px; font-weight: 700; color: #0f172a; margin: 0; }
        .header-bar p { color: var(--text-muted); margin-top: 5px; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .card { background: #ffffff; padding: 24px; border-radius: 14px; border: 1px solid var(--border-color); box-shadow: var(--shadow); position: relative; }
        .card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--primary); border-radius: 14px 14px 0 0; }
        .card h3 { font-size: 13px; color: var(--text-muted); margin: 0 0 10px 0; text-transform: uppercase; }
        .card .value { font-size: 26px; font-weight: 700; color: #0f172a; }

        .chart-container { background: white; padding: 25px; border-radius: 14px; border: 1px solid var(--border-color); box-shadow: var(--shadow); }
        .chart-container h3 { margin-bottom: 20px; color: #0f172a; }

        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(244, 246, 249, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>

    <div id="loadingOverlay">
        <i class="fa-solid fa-circle-notch fa-spin fa-3x" style="color: var(--primary);"></i>
        <p style="margin-top: 15px; font-weight: 600; color: var(--text-main); font-size: 15px;">Memuat data dashboard...</p>
    </div>

    <sidebar>
        <div class="sidebar-top">
            <h2><i class="fa-solid fa-pills"></i> TFU Sales</h2>
            <ul>
                <li class="active"><i class="fa-solid fa-chart-pie"></i> Dashboard</li>
                <li onclick="window.location.href='manajemen-sales.html'"><i class="fa-solid fa-users-gear"></i> Manajemen Sales</li>
                <li onclick="window.location.href='manajemen-apotek.html'"><i class="fa-solid fa-hospital"></i> Manajemen Apotek</li>
            </ul>
        </div>
        <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </sidebar>

    <main>
        <div class="dashboard-container">
            <div class="header-bar">
                <h1>Dashboard Global</h1>
                <p>Ringkasan performa penjualan seluruh wilayah</p>
            </div>

            <div class="stats-grid">
                <div class="card">
                    <h3>Total Order</h3>
                    <div class="value" id="totalOrders">0</div>
                </div>
                <div class="card">
                    <h3>Total Visitasi</h3>
                    <div class="value" id="totalVisits">0</div>
                </div>
                <div class="card">
                    <h3>Total Sales</h3>
                    <div class="value" id="totalSales">0</div>
                </div>
            </div>

            <div class="chart-container">
                <h3>Visualisasi Kunjungan vs Order</h3>
                <div style="position: relative; height: 320px; max-width: 400px; margin: 0 auto;">
                    <canvas id="salesChart"></canvas>
                </div>
            </div>
        </div>
    </main>

    <script>
        const token = localStorage.getItem('token');
        
        const ctx = document.getElementById('salesChart').getContext('2d');
        const salesChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Order (Berhasil)', 'Tanpa Order (Belum)'],
                datasets: [{
                    data: [0, 0],
                    backgroundColor: ['#2563eb', '#f97316'],
                    borderWidth: 0,
                    cutout: '70%'
                }],
                totalVisitsValue: 0
            },
            options: { 
                responsive: true,
                maintainAspectRatio: false,
                plugins: { 
                    legend: { position: 'bottom' } 
                }
            },
            plugins: [{
                id: 'centerText',
                beforeDraw: (chart) => {
                    const { ctx, chartArea: { top, width, height } } = chart;
                    ctx.save();
                    ctx.fillStyle = '#0f172a';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    ctx.font = 'bold 28px sans-serif';
                    ctx.fillText(chart.config.data.totalVisitsValue || 0, width / 2, top + height / 2 - 10);
                    
                    ctx.font = '12px sans-serif';
                    ctx.fillStyle = '#64748b';
                    ctx.fillText('TOTAL KUNJUNGAN', width / 2, top + height / 2 + 15);
                    ctx.restore();
                }
            }]
        });

        async function loadDashboardData() {
            try {
                const response = await fetch(`/api/manager/summary/all`, {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const result = await response.json();
                
                if (response.ok && result.success) {
                    document.getElementById('totalOrders').innerText = result.data.totalOrders || 0;
                    document.getElementById('totalVisits').innerText = result.data.totalVisits || 0;
                    document.getElementById('totalSales').innerText = result.data.totalSales || 0;
                }

                const resRatio = await fetch('/api/manager/visit-ratio', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const jsonRatio = await resRatio.json();
                
                if (resRatio.ok && jsonRatio.success) {
                    salesChart.data.datasets[0].data = [
                        jsonRatio.data.visitsWithOrder, 
                        jsonRatio.data.visitsWithoutOrder
                    ];
                    salesChart.config.data.totalVisitsValue = jsonRatio.data.totalVisits;
                    salesChart.update();
                }
            } catch (error) { 
                console.error('Error:', error); 
            } finally {
                const loader = document.getElementById('loadingOverlay');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 300);
                }
            }
        }

        function logout() { 
            localStorage.clear(); 
            window.location.href = '/index.html'; 
        }

        window.onload = loadDashboardData;
    </script>
</body>
</html>
