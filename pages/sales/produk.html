<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Produk - SFA Farmasi</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/sales.css">
</head>
<body>
    <header class="dashboard-header">
        <div class="user-profile-info">
            <div id="userAvatar" class="avatar-placeholder">BS</div>
            <div>
                <h4>Katalog Resmi</h4>
                <h2>Daftar Produk Farmasi</h2>
            </div>
        </div>
        <a href="/pages/sales/dashboard.html" class="notification-bell" style="text-decoration: none; display: flex; align-items: center; justify-content: center;" title="Kembali">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </a>
    </header>

    <main class="app-content">
        <h1 class="hero-greeting" style="font-size: 1.25rem; margin-bottom: 1rem;">Cari produk, cek harga, dan ketersediaan stok.</h1>

        <!-- Filter & Search Section -->
        <div class="section-block" style="padding: 1.25rem; border-top: 4px solid #2563eb; margin-bottom: 1.25rem;">
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <div>
                    <label style="display:block; font-size:0.8rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:#1e40af; margin-bottom:0.5rem;">Cari Nama Produk</label>
                    <div style="position: relative; display: flex; align-items: center; width: 100%;">
                        <div style="position: absolute; left: 1rem; color: #2563eb; display: flex; align-items: center; pointer-events: none;">
                            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                        </div>
                        <input type="text" id="searchProduct" placeholder="Ketik nama obat atau suplemen..." style="width:100%; padding:0.85rem 1rem 0.85rem 2.75rem; border-radius:var(--radius-md); border:1px solid #bfdbfe; outline:none; background:#f8fafc; font-size:0.9rem; color:var(--text-main); box-shadow:var(--shadow-card);">
                    </div>
                </div>

                <div>
                    <label style="display:block; font-size:0.8rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:#1e40af; margin-bottom:0.5rem;">Kategori</label>
                    <select id="categoryFilter" style="width:100%; padding:0.85rem 1rem; border-radius:var(--radius-md); border:1px solid #bfdbfe; outline:none; background:#f8fafc; font-size:0.9rem; color:var(--text-main); box-shadow:var(--shadow-card);">
                        <option value="">Semua Kategori</option>
                        <option value="obat_keras">Obat Keras</option>
                        <option value="obat_bebas">Obat Bebas</option>
                        <option value="suplemen">Suplemen & Vitamin</option>
                        <option value="alkes">Alat Kesehatan</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Product List Container -->
        <div id="productContainer" style="display: flex; flex-direction: column; gap: 0.75rem; padding-bottom: 2rem;">
            <!-- Placeholder / Data akan dirender otomatis melalui script -->
            <div class="section-block" style="padding: 1.5rem; text-align: center; color: var(--text-muted);">
                <p style="font-size: 0.9rem; margin: 0;">Memuat daftar produk...</p>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="/pages/sales/dashboard.html"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>Home</a>
        <a href="/pages/sales/kunjungan.html"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>Kunjungan</a>
        <a href="/pages/sales/inkaso.html"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>Inkaso</a>
        <a href="/pages/sales/produk.html" class="active"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>Produk</a>
        <a href="/pages/sales/profile.html"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>Profile</a>
    </nav>

    <script src="/js/api.js"></script>
    <script src="/js/sales/produk.js"></script>
</body>
</html>
