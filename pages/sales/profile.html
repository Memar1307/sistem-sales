    <header class="dashboard-header">

        <div id="profileContainer">
            <div style="background: #ffffff; padding: 2rem; text-align: center; color: #64748b; border-radius: 16px; border: 1px solid #e2e8f0;">
                Memuat profil...

        </div>

        <!-- Tombol Log Out -->
        <button id="logoutBtn" style="width: 100%; margin-top: 1.25rem; padding: 0.85rem 1rem; background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; font-size: 0.95rem; box-shadow: var(--shadow-card); transition: background 0.2s;">
