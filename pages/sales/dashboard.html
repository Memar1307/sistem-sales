<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Sales</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/sales.css">
</head>
<body>
    <!-- Top Profile Bar ala Referensi -->
    <header class="dashboard-header">
        <div class="user-profile-info">
            <div id="userAvatar" class="avatar-placeholder">BS</div>
            <div>
                <h4>Selamat Pagi!</h4>
                <h2 id="userName">Budi Sales</h2>
            </div>
        </div>
        <button class="notification-bell" aria-label="Notifikasi">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
        </button>
    </header>

    <main class="app-content">
        <h1 class="hero-greeting">Awali Dengan Bismillah, Jangan Lupa tersenyum.</h1>

        <!-- Quick Search Bar -->
        <div class="search-box">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <input type="text" placeholder="Cari apotek, obat, atau riwayat...">
        </div>

        <!-- Kartu Target Interaktif Utama (Menggantikan Kartu Kotak Biasa) -->
        <div class="active-task-card">
            <div class="task-card-header">
                <span>Target Bulan Ini</span>
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
            </div>
            
            <div class="task-stats-grid">
                <div class="task-stat-item">
                    <h3>Progress Order</h3>
                    <p id="progressOrder">0 / 0</p>
                </div>
                <div class="task-stat-item">
                    <h3>Kunjungan Hari Ini</h3>
                    <p id="visitToday">0</p>
                </div>
            </div>

            <a href="/pages/sales/kunjungan.html" class="btn-card-action">Mulai Kunjungan / Absen Baru</a>
        </div>

        <!-- Section Riwayat Kunjungan -->
        <section class="section-block">
            <div class="section-header-flex">
                <h3>Riwayat Kunjungan Terakhir</h3>
                <a href="#" class="view-all-link">Lihat Semua</a>
            </div>
            <div id="historyList" class="list-container">
                <p class="empty-text">Memuat data riwayat...</p>
            </div>
        </section>
    </main>

    <!-- Bottom Navigation Estetik -->
    <nav class="bottom-nav">
        <a href="/pages/sales/dashboard.html" class="active">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            Home
        </a>
        <a href="/pages/sales/kunjungan.html">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            Kunjungan
        </a>
        <a href="/pages/sales/inkaso.html">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
            Inkaso
        </a>
        <a href="/pages/sales/produk.html">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
            Produk
        </a>
        <a href="/pages/sales/profile.html">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            Profile
        </a>
    </nav>

    <script src="/js/api.js"></script>
    <script src="/js/sales/dashboard.js"></script>
</body>
</html>
