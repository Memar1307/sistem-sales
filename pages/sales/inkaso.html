<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencatatan Inkaso</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/sales.css">
</head>
<body>
    <header class="dashboard-header">
        <div class="user-profile-info">
            <div id="userAvatar" class="avatar-placeholder">BS</div>
            <div>
                <h4>Formulir Resmi</h4>
                <h2>Pencatatan Inkaso</h2>
            </div>
        </div>
        <a href="/pages/sales/dashboard.html" class="notification-bell" style="text-decoration: none; display: flex; align-items: center; justify-content: center;" title="Kembali">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </a>
    </header>

    <main class="app-content">
        <h1 class="hero-greeting" style="font-size: 1.25rem; margin-bottom: 1rem;">Pilih apotek dan lunasi tagihan/invoice.</h1>

        <div class="section-block" style="padding: 1.5rem; border-top: 4px solid #2563eb;">
            <form id="inkasoForm">
                <div style="margin-bottom: 1.25rem;">
                    <label style="display:block; font-size:0.8rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:#1e40af; margin-bottom:0.5rem;">Pilih Apotek</label>
                    <select id="pharmacySelect" required style="width:100%; padding:0.85rem 1rem; border-radius:var(--radius-md); border:1px solid #bfdbfe; outline:none; background:#f8fafc; font-size:0.9rem; color:var(--text-main); box-shadow:var(--shadow-card);">
                        <option value="">-- Memuat daftar apotek --</option>
                    </select>
                </div>

                <div style="margin-bottom: 1.25rem;">
                    <label style="display:block; font-size:0.8rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:#1e40af; margin-bottom:0.5rem;">Daftar Tagihan / Invoice</label>
                    <div id="invoiceContainer" style="border: 1px solid #bfdbfe; border-radius: var(--radius-md); padding: 0.75rem; background: #f8fafc; max-height: 200px; overflow-y: auto;">
                        <p style="font-size: 0.85rem; color: var(--text-muted); text-align: center; margin: 0;">Silakan pilih apotek terlebih dahulu.</p>
                    </div>
                    <input type="hidden" id="selectedInvoiceId" required>
                </div>

                <div style="margin-bottom: 1.25rem;">
                    <label style="display:block; font-size:0.8rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:#1e40af; margin-bottom:0.5rem;">Nominal Pembayaran (Rp)</label>
                    <!-- Ditambahkan min="0", onkeydown untuk blokir minus/huruf, dan oninput untuk validasi tambahan -->
                    <input type="number" id="nominalInput" placeholder="Masukkan jumlah yang dibayar" min="0" step="any" onkeydown="if(['-', 'e', 'E', '+'].includes(event.key)) event.preventDefault();" oninput="if(this.value < 0) this.value = '';" required style="width:100%; padding:0.85rem 1rem; border-radius:var(--radius-md); border:1px solid #bfdbfe; outline:none; background:#f8fafc; font-size:0.9rem; box-shadow:var(--shadow-card);">
                </div>

                <div style="margin-bottom: 1.25rem;">
                    <label style="display:block; font-size:0.8rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:#1e40af; margin-bottom:0.5rem;">Metode Pembayaran</label>
                    <select id="metodeSelect" required style="width:100%; padding:0.85rem 1rem; border-radius:var(--radius-md); border:1px solid #bfdbfe; outline:none; background:#f8fafc; font-size:0.9rem; color:var(--text-main); box-shadow:var(--shadow-card);">
                        <option value="cash">💵 Tunai (Cash)</option>
                        <option value="transfer">🏦 Transfer Bank</option>
                        <option value="giro">📄 Giro / Cheque</option>
                    </select>
                </div>

                <div style="margin-bottom: 1.25rem;">
                    <label style="display:block; font-size:0.8rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:#1e40af; margin-bottom:0.5rem;">Foto Bukti Pembayaran (Wajib Kamera)</label>
                    <div style="position: relative; display: flex; align-items: center; width: 100%; border: 1px solid #bfdbfe; border-radius: var(--radius-md); background: #eff6ff; box-shadow: var(--shadow-card); overflow: hidden;">
                        <div style="padding: 0 1rem; color: #2563eb; display: flex; align-items: center; justify-content: center; background: #dbeafe; border-right: 1px solid #bfdbfe; min-height: 50px;">
                            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        </div>
                        <label for="fotoBukti" style="display: flex; align-items: center; width: 100%; padding: 0.85rem 1rem; cursor: pointer; font-size: 0.9rem; color: #1e3a8a; font-weight: 500;">
                            <span id="fileLabelInkaso" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Ketuk untuk buka kamera / pilih foto...</span>
                        </label>
                        <input type="file" id="fotoBukti" accept="image/*" capture="environment" required style="display: none;" onchange="document.getElementById('fileLabelInkaso').textContent = this.files[0] ? this.files[0].name : 'Ketuk untuk buka kamera / pilih foto...';">
                    </div>
                </div>

                <div style="margin-bottom: 1.5rem;">
                    <label style="display:block; font-size:0.8rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:#1e40af; margin-bottom:0.5rem;">Catatan Tambahan</label>
                    <textarea id="catatanInput" rows="2" placeholder="Keterangan..." style="width:100%; padding:0.85rem 1rem; border-radius:var(--radius-md); border:1px solid #bfdbfe; outline:none; background:#f8fafc; font-size:0.9rem; color:var(--text-main); box-shadow:var(--shadow-card); resize:none;"></textarea>
                </div>

                <button type="submit" class="btn-primary" id="submitBtn" style="padding: 1rem; font-size: 0.95rem; border-radius: var(--radius-md); background: linear-gradient(135deg, #2563eb, #1d4ed8); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);">Bayar Tagihan Inkaso</button>
            </form>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="/pages/sales/dashboard.html"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>Home</a>
        <a href="/pages/sales/kunjungan.html"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>Kunjungan</a>
        <a href="/pages/sales/inkaso.html" class="active"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>Inkaso</a>
        <a href="/pages/sales/produk.html"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>Produk</a>
        <a href="/pages/sales/profile.html"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>Profile</a>
    </nav>

    <script src="/js/api.js"></script>
    <script src="/js/sales/inkaso.js"></script>
</body>
</html>
